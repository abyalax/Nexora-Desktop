[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
publish = false

[workspace.dependencies]
windows = "0.62"
windows-core = "0.62"
windows-numerics = "0.3"
nexora-core = { path = "crates/core" }
nexora-platform = { path = "crates/platform" }
nexora-ui = { path = "crates/ui" }
serde_json = "1"
png = "0.17"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
